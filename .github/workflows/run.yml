name: Exécution du modèle

on:
  push:
    branches: [main]
    paths-ignore: ["outputs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Entraînement et évaluation sur freMTPL2
        run: python main.py
      - name: Publication des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs README.md
          git diff --cached --quiet || git commit -m "Mise à jour des résultats [skip ci]"
          git push
